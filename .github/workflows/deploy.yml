name: Deploy

# Deploys to Cloudflare on every push to main. Lint, typecheck and the RAG
# evaluation suite run first — a failing evaluation blocks the deploy, which is
# the point: five of the defects in src/content/knowledge/how-this-works.md
# reported success while returning nothing useful.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Evaluate chatbot
        # Scored against the live site, so it reports on what visitors get.
        #
        # A 0/N score means the chatbot is completely unavailable — quota
        # exhausted, generation failing, endpoint down. That must fail the build:
        # an earlier version of this file warned instead, and a run scoring 0/20
        # went green. A partial score still warns, because content may simply
        # not be indexed yet.
        run: |
          set +e
          npm run eval
          code=$?
          if [ $code -ne 0 ]; then
            total=$(npm run eval 2>&1 | grep -oE "Total +[0-9]+/[0-9]+" | grep -oE "[0-9]+/[0-9]+" | head -1)
            passed=$(echo "$total" | cut -d/ -f1)
            count=$(echo "$total" | cut -d/ -f2)
            if [ -n "$total" ] && [ "$passed" = "0" ]; then
              echo "::error::Chatbot scored 0/${count} — every case failed. Blocking deploy."
              exit 1
            fi
            echo "::warning::Evaluation scored ${total} — not all cases passed. Deploying anyway."
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The prebuild hook runs scripts/extract-cv.mjs, which shells out to
      # pdftotext. Poppler must be present BEFORE the first build or the résumé
      # silently does not get converted.
      - name: Install poppler (résumé → Markdown step)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build
        run: npm run build

      - name: Render icons and OG image
        run: node scripts/render-assets.mjs

      - name: Deploy to Cloudflare
        run: npx nitro deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
