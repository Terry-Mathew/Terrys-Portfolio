name: Deploy

# Deploys to Cloudflare on every push to main. Lint, typecheck and the RAG
# evaluation suite run first — a failing evaluation blocks the deploy, which is
# the point: five of the defects in src/content/knowledge/how-this-works.md
# reported success while returning nothing useful.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test server guards
        # The lead-capture guards and the conversation clamp are the only things
        # standing between a browser and a bogus notification or an uncapped
        # prompt. Neither is checkable in production, so both are tested here.
        #
        # INGEST_KEY is passed so the three retrieval diagnostics run rather
        # than skip. Without it they are silently absent, and the whole reason
        # they exist is that a stale corpus and a bad persona produce the same
        # symptom — so a check that quietly stops running is worse than one
        # that never existed.
        run: npm test
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The prebuild hook runs scripts/extract-cv.mjs, which shells out to
      # pdftotext. Poppler must be present BEFORE the first build or the résumé
      # silently does not get converted.
      - name: Install poppler (résumé → Markdown step)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build
        run: npm run build

      - name: Render icons and OG image
        run: node scripts/render-assets.mjs

      - name: Deploy to Cloudflare
        # Two steps, deliberately. `nitro deploy` has intermittently uploaded a
        # version without promoting it, leaving the previous code serving live
        # while the run reported success — twice locally, and the same command
        # is what CI uses. Promoting the exact version it just uploaded, then
        # asserting the running code answers, removes the ambiguity.
        run: |
          set -euo pipefail
          VERSION=$(npx nitro deploy --prebuilt 2>&1 | tee /tmp/deploy.log | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the uploaded version id from the deploy log."
            cat /tmp/deploy.log
            exit 1
          fi
          echo "Uploaded version $VERSION — promoting explicitly."
          npx wrangler versions deploy "$VERSION" --name terry-portfolio --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify (deploy succeeded)
        # Only reached when every step above passed, including the live
        # /api/chat contract check.
        #
        # A push failure must not fail the deploy — the site is already live by
        # this point. But it must not be invisible either.
        #
        # This used to run `set +e`, curl, and print the response without ever
        # reading it. A wrong token produced `{"token":"invalid"}` in the log, a
        # green step, and no notification — so deploys have been finishing
        # silently for some time and nothing in the run said so. Pushover
        # answers `{"status":1,...}` on success and `{"status":0,...}` with an
        # `errors` array otherwise; reading that one field is the whole fix.
        if: always() && success()
        run: |
          set +e
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            echo "::warning::PUSHOVER_TOKEN or PUSHOVER_USER is not set as a GitHub environment secret, so this deploy produced no notification. Set it with: gh secret set PUSHOVER_TOKEN --env production"
            exit 0
          fi
          resp=$(curl -sS -X POST https://api.pushover.net/1/messages.json \
            --data-urlencode "token=$PUSHOVER_TOKEN" \
            --data-urlencode "user=$PUSHOVER_USER" \
            --data-urlencode "title=Deploy succeeded" \
            --data-urlencode "message=terrymathew.com — commit ${GITHUB_SHA:0:7} is live. Workflow: ${GITHUB_RUN_ID}" \
            --data-urlencode "url=https://github.com/Terry-Mathew/Terrys-Portfolio/commit/${GITHUB_SHA}" \
            --data-urlencode "url_title=View commit" \
            --max-time 10)
          echo "pushover: $resp"
          if echo "$resp" | grep -qF '"status":1'; then
            echo "::notice::Deploy notification sent."
          else
            echo "::warning::Deploy succeeded, but NO notification was sent. Pushover answered: $resp"
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}

      - name: Verify the deployed version is live
        # Proves the code that was just pushed is the code serving traffic, and
        # that it is the CURRENT code.
        #
        # Without the first half, an unpromoted upload is indistinguishable from
        # success. Without the second, a stale Worker version passes while the
        # previous release serves traffic — which is what happened: this step
        # used to accept any response containing the string `"type"`, and every
        # build of this endpoint has emitted that since the route existed. It
        # reported success while the old build was live, and the fingerprint had
        # to be checked by hand from a terminal.
        #
        # The markers are the current stream contract: the four SSE event names
        # and the two fields the widget reads off `done`. An older build fails
        # the first four and cannot get through.
        run: |
          set -euo pipefail
          sleep 10
          # Update this list when the stream contract changes, or every future
          # deploy will fail here.
          MARKERS='"type":"started" "type":"phase" "type":"sources" "type":"done" "timings" "provider"'
          for i in 1 2 3 4 5; do
            body=$(curl -sS -X POST https://terrymathew.com/api/chat \
              -H 'content-type: application/json' \
              -d '{"q":"ping","history":[]}' --max-time 30 || true)
            missing=""
            for m in $MARKERS; do
              echo "$body" | grep -qF -- "$m" || missing="$missing $m"
            done
            if [ -z "$missing" ]; then
              echo "Live endpoint serving the current build."
              echo "$body" | head -c 200
              exit 0
            fi
            if [ "$i" = 5 ]; then
              echo "::error::The live endpoint responded but does not match the current stream contract. Missing:$missing"
              echo "::error::This means the upload was not promoted, or a previous Worker version is still serving traffic."
              echo "$body" | head -c 400
              exit 1
            fi
            echo "Attempt $i: contract mismatch (missing:$missing), retrying in 10s…"
            sleep 10
          done

      - name: Ingest the knowledge corpus
        # The corpus is bundled at build time, so it can only be loaded AFTER
        # the version carrying the new knowledge files is live. Until this runs,
        # the chatbot answers from the previous release's content.
        #
        # This step previously reported success while doing nothing at all,
        # because INGEST_KEY was not set as a GitHub secret, the request was
        # unauthorised, and the `if` below only warned. The same mistake the
        # project docs warn about: a step that cannot fail cannot tell you
        # anything. It now distinguishes "no key configured", "request refused"
        # and "corpus did not load", and the last two fail the job.
        run: |
          if [ -z "${{ secrets.INGEST_KEY }}" ]; then
            echo "::error::INGEST_KEY is not set as a GitHub environment secret, so the corpus cannot be loaded. Set it with: gh secret set INGEST_KEY --env production"
            exit 1
          fi
          resp=$(curl -sS -X POST https://terrymathew.com/api/ingest \
            -H "x-ingest-key: ${{ secrets.INGEST_KEY }}" --max-time 180 -w '\nHTTP:%{http_code}')
          echo "ingest: $resp"
          if ! echo "$resp" | grep -q '"ok":true'; then
            echo "::error::Corpus ingest did not succeed — retrieval will serve the previous content until it does."
            exit 1
          fi
          indexed=$(echo "$resp" | grep -oE '"indexed":[0-9]+' | cut -d: -f2)
          removed=$(echo "$resp" | grep -oE '"removedDocs":[0-9]+' | cut -d: -f2)
          vectors=$(echo "$resp" | grep -oE '"removedVectors":[0-9]+' | cut -d: -f2)
          echo "::notice::Corpus current: ${indexed:-0} chunk(s) indexed, ${removed:-0} stale document(s) and ${vectors:-0} stale vector(s) removed."

      - name: Probe semantic retrieval
        # A page check plus a chat event is not enough: the site can be fully
        # healthy while Vectorize is empty, and the only symptom is answers
        # quietly coming from the keyword path.
        #
        # Retries, because the first request after a deploy can land while the
        # edge is still serving a stale isolate. It reports which check failed
        # rather than dying silently on a non-matching grep.
        run: |
          mode=""
          gen=""
          deg=""
          health=""
          for i in 1 2 3; do
            body=$(curl -sS -X POST https://terrymathew.com/api/chat \
              -H 'content-type: application/json' \
              -d '{"q":"what is settle","history":[]}' --max-time 45 || true)
            if echo "$body" | grep -qF '"type":"done"'; then
              mode=$(echo "$body" | grep -oE '"retrievalMode":"[a-z]+"' | head -1 | cut -d'"' -f4 || true)
              gen=$(echo "$body" | grep -oE '"generation":"[a-z-]+"' | head -1 | cut -d'"' -f4 || true)
              deg=$(echo "$body" | grep -oE '"degraded":(true|false)' | head -1 | cut -d: -f2 || true)
              health=$(echo "$body" | grep -oE '"health":\{[^}]*\}' | head -1 || true)
              [ -n "$mode" ] && break
            fi
            echo "attempt $i: no usable response, retrying in 10s"
            sleep 10
          done
          if [ -z "$mode" ]; then
            echo "::error::No response from /api/chat after 3 attempts. Cannot confirm retrieval."
            exit 1
          fi
          echo "retrieval=${mode} generation=${gen:-none} degraded=${deg:-unknown}"
          [ -n "$health" ] && echo "retrieval health: $health"
          if [ "$mode" = "static" ]; then
            echo "::error::Retrieval fell back to static — the vector index is not serving. Ingestion is the usual cause."
            exit 1
          fi
          # The probe runs immediately after ingestion, so a degraded answer here
          # is a deployment fault rather than an unlucky visitor. Blocking it is
          # what stops a broken release reaching people quietly — previously
          # this step passed on a run where the chatbot was already degraded.
          if [ "$deg" = "true" ]; then
            echo "::error::The deployed chatbot answered the probe from a fallback: a retrieval method failed, or no model answered. See the retrieval health line above."
            exit 1
          fi

      - name: Evaluate the deployed chatbot
        # Deliberately AFTER the deploy. This used to run before it, which meant
        # it scored the previous release and the pull request was never actually
        # measured — a green run on this job said nothing about the change.
        #
        # The suite classifies its own failures and returns the class as the exit
        # code, because a single score cannot carry both decisions:
        #
        #   1  availability  BLOCK. No model answered, cases were rate limited, or
        #      nothing passed at all. Shipping a chatbot that cannot answer is
        #      worse than not shipping one, and this is a real regression — the
        #      deploy immediately before this step already proved the endpoint
        #      responds.
        #   2  content       WARN. The chatbot answered; retrieval or phrasing did
        #      not land. Content lags a deploy by design (the corpus is ingested
        #      after), models phrase things differently, and a golden case keyed
        #      on the string "300" is a fragile thing to block every push on.
        #
        # This step previously swallowed every failure with `set +e` and only
        # warned — so the gate could not fail a deploy even when the chatbot was
        # completely dead, which is the one thing it existed to catch.
        run: |
          set +e
          npm run eval
          code=$?
          set -e
          case "$code" in
            0)
              echo "::notice::Evaluation passed in full."
              ;;
            2)
              echo "::warning::Evaluation had content misses — the chatbot answered, but some answers did not contain the expected facts. Review the run summary; this does not block the deploy."
              ;;
            1)
              echo "::error::Evaluation reports an AVAILABILITY failure — the deployed chatbot is not answering. This blocks the deploy."
              exit 1
              ;;
            *)
              echo "::error::Evaluation exited $code, which it should never do. Treating it as a failure."
              exit 1
              ;;
          esac
